
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ghost Escape 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#030807;font-family:Arial;color:white}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
#top{display:flex;justify-content:space-between;padding:16px}
.panel{background:rgba(0,0,0,.55);padding:12px 18px;border:1px solid #426458;border-radius:12px}
#score{font-size:23px;font-weight:bold;color:#ffe68a}
#status{font-size:13px;color:#b5d7c6;margin-top:5px}
#message{position:absolute;top:42%;width:100%;text-align:center;font-size:32px;font-weight:bold;text-shadow:0 0 18px #00ffcc}
#start{pointer-events:auto;position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);
background:#0b8d69;color:white;border:1px solid #6affd0;border-radius:14px;padding:16px 30px;font-size:19px}
#controls{position:absolute;bottom:22px;left:22px;width:130px;height:130px;pointer-events:auto}
#base{width:130px;height:130px;background:#ffffff22;border:2px solid #ffffff55;border-radius:50%;position:relative}
#stick{width:56px;height:56px;background:#d5fff088;border:2px solid #fff9;border-radius:50%;position:absolute;left:35px;top:35px}
#rightControls{position:absolute;right:24px;bottom:36px;pointer-events:auto}
#boost{width:80px;height:80px;border-radius:50%;background:#166eae99;border:2px solid #8ed8ff;color:white;font-weight:bold}
#hint{position:absolute;bottom:8px;width:100%;text-align:center;font-size:12px;color:#b9c9c4}
</style>
</head>
<body>
<div id="ui">
  <div id="top">
    <div class="panel">
      <div id="score">COINS: 0</div>
      <div id="status">FOREST SURVIVAL</div>
    </div>
    <div class="panel">GHOST ESCAPE<br><span style="color:#9dfbd8">3D SURVIVAL</span></div>
  </div>
  <div id="message"></div>
  <button id="start">START ESCAPE</button>
  <div id="controls">
    <div id="base"><div id="stick"></div></div>
  </div>
  <div id="rightControls"><button id="boost">SPRINT</button></div>
  <div id="hint">JOYSTICK: MOVE • COLLECT COINS • ESCAPE THE GHOST</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
if(!window.THREE){document.getElementById("message").textContent="3D engine failed to load";return;}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x06110d);
scene.fog=new THREE.FogExp2(0x06110d,.025);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position="fixed";
renderer.domElement.style.inset="0";
renderer.domElement.style.zIndex="0";

scene.add(new THREE.HemisphereLight(0x9bd8bf,0x101a11,1.4));
const moon=new THREE.DirectionalLight(0xb7e5d1,1.5);
moon.position.set(-15,30,10);
moon.castShadow=true;
moon.shadow.mapSize.set(1024,1024);
scene.add(moon);

const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const groundMat=mat(0x17251b);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),groundMat);
ground.rotation.x=-Math.PI/2;ground.position.y=-.15;ground.receiveShadow=true;
scene.add(ground);

// Path
const path=new THREE.Mesh(new THREE.PlaneGeometry(7,500),mat(0x30352d));
path.rotation.x=-Math.PI/2;path.position.y=-.1;scene.add(path);

// Trees
function tree(x,z){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.32,3,7),mat(0x483626));
 trunk.position.set(x,1.5,z);trunk.castShadow=true;scene.add(trunk);
 for(let i=0;i<3;i++){
   const crown=new THREE.Mesh(new THREE.ConeGeometry(1.7-i*.25,3.1,8),mat(i===0?0x153c29:0x1e5132));
   crown.position.set(x,3+i*1.35,z);
   crown.castShadow=true;scene.add(crown);
 }
}
for(let z=-240;z<80;z+=7){
 tree(-6-Math.random()*8,z);
 tree(6+Math.random()*8,z-Math.random()*3);
}

// Decorative rocks
for(let i=0;i<90;i++){
 const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.4+Math.random()*.8),
 mat(0x303a33));
 rock.position.set((Math.random()>.5?1:-1)*(4+Math.random()*14),.2,Math.random()*400-220);
 rock.castShadow=true;scene.add(rock);
}

// Player
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,4,8),mat(0x33b8a3));
body.position.y=1;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,12),mat(0xc8e5d5));
head.position.y=1.82;player.add(head);
const eyeMat=new THREE.MeshBasicMaterial({color:0x071510});
for(const x of [-.12,.12]){
 const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),eyeMat);
 eye.position.set(x,1.85,.28);player.add(eye);
}
scene.add(player);

// Ghost
const ghost=new THREE.Group();
const ghostMat=new THREE.MeshStandardMaterial({
 color:0x9fffe7,transparent:true,opacity:.5,
 emissive:0x36ffcf,emissiveIntensity:1.2
});
const ghostBody=new THREE.Mesh(new THREE.SphereGeometry(.8,16,12),ghostMat);
ghostBody.scale.y=1.4;ghost.add(ghostBody);
const ghostTail=new THREE.Mesh(new THREE.ConeGeometry(.65,1.4,12),ghostMat);
ghostTail.position.y=-1.1;ghost.add(ghostTail);
const ghostEyes=new THREE.Mesh(new THREE.BoxGeometry(.38,.14,.1),new THREE.MeshBasicMaterial({color:0x102f35}));
ghostEyes.position.set(0,.15,.73);ghost.add(ghostEyes);
const glow=new THREE.PointLight(0x60ffda,2,9);
ghost.add(glow);
scene.add(ghost);

// Coins
const coins=[];
const coinGeo=new THREE.TorusGeometry(.32,.09,8,16);
const coinMat=new THREE.MeshStandardMaterial({color:0xffd84a,metalness:.8,roughness:.25,emissive:0x664400});
function spawnCoin(x,z){
 const c=new THREE.Mesh(coinGeo,coinMat);
 c.position.set(x,.8,z);c.castShadow=true;scene.add(c);coins.push(c);
}
for(let i=0;i<18;i++)spawnCoin((Math.random()-.5)*4,-12-i*7);

// Game state
let running=false,score=0,gameTime=0,ghostDistance=13;
const velocity=new THREE.Vector3();
const direction=new THREE.Vector3();
let joystick={x:0,y:0};
let sprint=false;
let lastCoinDrop=0;

function startGame(){
 player.position.set(0,0,0);
 ghost.position.set(0,0,-13);
 score=0;gameTime=0;ghostDistance=13;
 running=true;
 document.getElementById("score").textContent="COINS: 0";
 document.getElementById("status").textContent="RUN!";
 document.getElementById("message").textContent="";
 document.getElementById("start").style.display="none";
}
function endGame(){
 running=false;
 document.getElementById("message").innerHTML="THE GHOST CAUGHT YOU";
 document.getElementById("start").textContent="TRY AGAIN";
 document.getElementById("start").style.display="block";
}

// Touch joystick
const base=document.getElementById("base"),stick=document.getElementById("stick");
let activePointer=null;
function joystickMove(e){
 const r=base.getBoundingClientRect();
 const cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const max=43,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 joystick.x=dx/max;joystick.y=dy/max;
 stick.style.left=(35+dx)+"px";stick.style.top=(35+dy)+"px";
}
base.addEventListener("pointerdown",e=>{
 activePointer=e.pointerId;base.setPointerCapture(e.pointerId);joystickMove(e);
});
base.addEventListener("pointermove",e=>{if(activePointer===e.pointerId)joystickMove(e)});
function resetStick(){
 activePointer=null;joystick.x=0;joystick.y=0;
 stick.style.left="35px";stick.style.top="35px";
}
base.addEventListener("pointerup",resetStick);
base.addEventListener("pointercancel",resetStick);

document.getElementById("boost").addEventListener("pointerdown",()=>sprint=true);
document.getElementById("boost").addEventListener("pointerup",()=>sprint=false);
document.getElementById("boost").addEventListener("pointercancel",()=>sprint=false);
document.getElementById("start").onclick=startGame;

// Keyboard
const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 if(running){
   gameTime+=dt;
   const ix=joystick.x+(keys.a?-1:0)+(keys.d?1:0);
   const iz=joystick.y+(keys.w?-1:0)+(keys.s?1:0);
   direction.set(ix,0,iz);
   if(direction.length()>1)direction.normalize();
   const speed=sprint?11:7;
   player.position.x+=direction.x*speed*dt;
   player.position.z+=direction.z*speed*dt;
   player.position.x=Math.max(-12,Math.min(12,player.position.x));
   if(direction.length()>.1)player.rotation.y=Math.atan2(direction.x,direction.z);

   // Ghost follows player
   const chaseSpeed=3.2+Math.min(gameTime*.12,2.3);
   const toPlayer=new THREE.Vector3(player.position.x-ghost.position.x,0,player.position.z-ghost.position.z);
   const dist=toPlayer.length();
   if(dist>0.01)ghost.position.add(toPlayer.normalize().multiplyScalar(chaseSpeed*dt));
   ghost.position.y=1.1+Math.sin(gameTime*3)*.25;
   ghost.rotation.y=Math.sin(gameTime)*.4;

   // Ghost drops coins along its trail
   if(gameTime-lastCoinDrop>2.1){
     spawnCoin(ghost.position.x+(Math.random()-.5)*2,ghost.position.z);
     lastCoinDrop=gameTime;
   }

   // Collect coins
   for(let i=coins.length-1;i>=0;i--){
     const c=coins[i];
     c.rotation.y+=dt*3;c.rotation.x+=dt*1.3;
     if(c.position.distanceTo(player.position)<1.4){
       scene.remove(c);coins.splice(i,1);score++;
       document.getElementById("score").textContent="COINS: "+score;
     }
   }

   // Camera follows
   const target=new THREE.Vector3(player.position.x,4.2,player.position.z+7);
   camera.position.lerp(target,1-Math.exp(-4*dt));
   camera.lookAt(player.position.x,1,player.position.z-4);

   // Game over if caught
   if(dist<1.6)endGame();
   document.getElementById("status").textContent="TIME: "+Math.floor(gameTime)+"s";
 }
 renderer.render(scene,camera);
}
const clock=new THREE.Clock();
animate();
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
</body>
</html>
